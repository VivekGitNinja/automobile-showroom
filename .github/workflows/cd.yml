name: CD — Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        default: 'production'
        type: choice
        options: [staging, production]

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_LC }}/api:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/nextjs:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_LC }}/nextjs:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SITE_NAME=${{ secrets.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/showroom
            # Save current image digests for rollback
            docker compose images --format json > /tmp/pre-deploy-images.json || true
            docker compose pull api nextjs sync-worker notif-worker
            docker compose up -d --no-deps api nextjs sync-worker notif-worker
            sleep 15
            # Health check
            if ! wget --no-verbose --tries=3 --spider http://localhost:4000/api/v1/health; then
              echo "Health check failed! Rolling back..."
              docker compose down api nextjs sync-worker notif-worker
              docker compose up -d --no-deps api nextjs sync-worker notif-worker
              exit 1
            fi
            docker compose exec api npx prisma migrate deploy
            echo "Deploy ${{ env.IMAGE_TAG }} complete"
