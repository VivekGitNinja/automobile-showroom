name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  ci-api:
    name: API — Type Check, Lint, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: showroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci --frozen-lockfile
      - run: npx prisma generate
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --run --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/showroom_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-256bits
          JWT_REFRESH_SECRET: test-refresh-secret-256bits
      - run: npm run build

  ci-frontend:
    name: Frontend — Type Check, Lint, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --frozen-lockfile
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://staging.showroom.ae
          NEXT_PUBLIC_SITE_URL: https://staging.showroom.ae
          NEXT_PUBLIC_SITE_NAME: Luxury Showroom Dubai
          NEXT_PUBLIC_WHATSAPP_NUMBER: '971508919441'
